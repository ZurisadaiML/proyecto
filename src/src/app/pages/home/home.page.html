
<ion-header>
  <ion-toolbar>
    <ion-title class="ion-text-center">Mis Tareas</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content [fullscreen]="true">

  <!-- Formulario para agregar tareas -->
  <ion-item>
    <ion-input type="text" placeholder="Nueva Tarea" name="task" [(ngModel)]="task"></ion-input>

    <ion-button slot="end" (click)="addTask()" [disabled]="!task.trim()">
      <ion-icon slot="icon-only" name="add-outline"></ion-icon>
    </ion-button>
  </ion-item>

  <!-- Mensaje cuando no existen tareas -->
  @if (tasks.length === 0) {
    <ion-item class="ion-text-center" lines="none">
      <ion-label>No hay tareas pendientes</ion-label>
    </ion-item>
  } @else {

    <!-- Lista de tareas -->
    <ion-list>
      <ion-reorder-group [disabled]="false" (ionItemReorder)="handleReorder($event)">

        @for (task of tasks; track task) {
          <ion-item-sliding>

            <ion-item>
              <ion-label>{{ task }}</ion-label>
              <ion-reorder slot="end"></ion-reorder>
            </ion-item>

            <!-- Opciones para eliminar tareas -->
            <ion-item-options side="end">
              <ion-item-option color="danger" (click)="confirmDeleteTask(task)">
                <ion-icon slot="icon-only" name="trash-outline"></ion-icon>
              </ion-item-option>
            </ion-item-options>

          </ion-item-sliding>
        }

      </ion-reorder-group>
    </ion-list>

  }

</ion-content>
